<svg xmlns="http://www.w3.org/2000/svg"
     width="980" height="620"
     viewBox="0 0 980 620">

  <title>Smart AI Fan — Track 1 Round 1 system block diagram</title>
  <desc>Proposed architecture: ambient temperature/humidity sensing → local controller → comfort and automation logic → motor-control interface and/or smart-home output → feedback and status reporting. Items marked proposed are not presented as implemented.</desc>

  <defs>
    <style>
      text { font-family: sans-serif; }
      .small { font-size: 13px; fill:#111; }
      .tiny  { font-size: 11px; fill:#444; }
      .label { font-size: 14px; fill:#0b0b0b; font-weight:600; }
      .box { fill:#ffffff; stroke:#222; stroke-width:1.6; }
      .box-proposed { fill:#fff7e6; stroke:#b35400; stroke-width:1.6; stroke-dasharray:7 4; }
      .box-existing { fill:#eef6ff; stroke:#1f4e9a; stroke-width:1.6; }
      .arrow { stroke:#333; stroke-width:1.8; fill:none; marker-end:url(#arw); }
      .arrow-return { stroke:#555; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arw); }
      .legend { font-size:12px; fill:#111; }
      .tag { font-size:11px; fill:#fff; font-weight:600; }
      .tag-proposed { fill:#b35400; }
      .tag-existing { fill:#1f4e9a; }
    </style>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="980" height="620" fill="#fbfbf9"/>

  <!-- title -->
  <text x="30" y="34" class="label">Smart AI Fan — Track 1 Round 1 system block diagram</text>
  <text x="30" y="54" class="tiny">Primary area: Fan as an enabler for smart home — ambient temperature and humidity-based triggers to control connected devices.</text>
  <text x="30" y="70" class="tiny">Solid boxes = proposed in Round 1. Dashed orange = future engineering stage, not part of the immediate demonstrator.</text>

  <!-- ===== Column headers ===== -->
  <text x="40"  y="108" class="label">SENSING</text>
  <text x="250" y="108" class="label">CONTROL &amp; LOGIC</text>
  <text x="490" y="108" class="label">ACTUATION / FAN OUTPUT</text>
  <text x="730" y="108" class="label">COMMUNICATIONS / USER</text>

  <!-- ===== Sensing column ===== -->
  <rect x="30"  y="128" width="190" height="62" class="box-existing"/>
  <text x="40" y="152" class="label">Temp / humidity sensor</text>
  <text x="40" y="170" class="tiny">local ambient input to controller</text>
  <text x="40" y="184" class="tiny">plausibility check on readings</text>

  <rect x="30"  y="200" width="190" height="54" class="box-proposed"/>
  <text x="40" y="222" class="label">Occupancy sensor <tspan class="tag" style="font-size:9px">OPTIONAL</tspan></text>
  <text x="40" y="240" class="tiny">only if a clear use case exists</text>

  <rect x="30"  y="262" width="190" height="46" class="box-proposed"/>
  <text x="40" y="282" class="label">Test instrumentation <tspan class="tag" style="font-size:9px">ROUND 1</tspan></text>
  <text x="40" y="298" class="tiny">power / response-time measurement</text>

  <!-- ===== Control column ===== -->
  <rect x="240" y="128" width="200" height="62" class="box-existing"/>
  <text x="250" y="152" class="label">Local controller</text>
  <text x="250" y="170" class="tiny">reads sensors; runs comfort logic</text>
  <text x="250" y="184" class="tiny">manual override interface</text>

  <rect x="240" y="200" width="200" height="62" class="box-proposed"/>
  <text x="250" y="222" class="label">Comfort &amp; automation logic</text>
  <text x="250" y="240" class="tiny">temp/humidity-based triggers</text>
  <text x="250" y="256" class="tiny">connected-device actions, where useful</text>

  <rect x="240" y="272" width="200" height="50" class="box-proposed"/>
  <text x="250" y="292" class="label">Safe-fallback supervisor <tspan class="tag" style="font-size:9px">PROPOSED</tspan></text>
  <text x="250" y="308" class="tiny">implausible input → conservative mode</text>

  <!-- ===== Actuation column ===== -->
  <rect x="480" y="128" width="200" height="62" class="box-proposed"/>
  <text x="490" y="150" class="label">Fan drive interface <tspan class="tag" style="font-size:9px">ROUND 1</tspan></text>
  <text x="490" y="168" class="tiny">safe test-bench / test load</text>
  <text x="490" y="182" class="tiny">or representative motor-control interface</text>

  <rect x="480" y="200" width="200" height="62" class="box-proposed"/>
  <text x="490" y="222" class="label">Connected-device output</text>
  <text x="490" y="240" class="tiny">smart-home trigger path, where useful</text>
  <text x="490" y="256" class="tiny">local control preferred for safety</text>

  <rect x="480" y="272" width="200" height="62" class="box-proposed"/>
  <text x="490" y="294" class="label">Full-size fan &amp; composite rotor <tspan class="tag" style="font-size:9px">FUTURE STAGE</tspan></text>
  <text x="490" y="310" class="tiny">1.40 m / 380 RPM concept — not Round 1</text>
  <text x="490" y="324" class="tiny">containment/rotor validation outstanding</text>

  <!-- ===== Communications column ===== -->
  <rect x="720" y="128" width="220" height="62" class="box-proposed"/>
  <text x="730" y="150" class="label">Local / network interface</text>
  <text x="730" y="168" class="tiny">remote or dashboard interaction, optional</text>
  <text x="730" y="182" class="tiny">local behavior must survive network loss</text>

  <rect x="720" y="200" width="220" height="62" class="box-proposed"/>
  <text x="730" y="222" class="label">User control &amp; manual override</text>
  <text x="730" y="240" class="tiny">simple local control interface</text>
  <text x="730" y="256" class="tiny">override takes precedence over automation</text>

  <rect x="720" y="272" width="220" height="50" class="box-proposed"/>
  <text x="730" y="290" class="label">Feedback &amp; status reporting</text>
  <text x="730" y="306" class="tiny">status, faults, and mode reporting</text>

  <!-- ===== Main arrows (left to right) ===== -->
  <path d="M 221 159 L 240 159" class="arrow"/>
  <path d="M 440 159 L 480 159" class="arrow"/>
  <path d="M 680 159 L 720 159" class="arrow"/>

  <!-- sensing -> controller -->
  <path d="M 221 160 L 240 160" class="arrow"/>
  <!-- controller -> fan drive interface -->
  <path d="M 440 159 L 480 159" class="arrow"/>
  <!-- controller -> connected-device output -->
  <path d="M 440 231 L 480 231" class="arrow"/>
  <!-- logic -> connected-device output -->
  <path d="M 440 231 L 480 231" class="arrow"/>
  <!-- controller -> user control -->
  <path d="M 680 231 L 720 231" class="arrow"/>

  <!-- control-logic arrows -->
  <path d="M 250 190 L 250 200" class="arrow"/>
  <path d="M 490 190 L 490 200" class="arrow"/>

  <!-- feedback return arrows -->
  <path d="M 830 300 Q 600 360 250 300" class="arrow-return"/>
  <path d="M 730 231 L 730 162" class="arrow-return"/>

  <!-- status reporting arrow -->
  <path d="M 730 290 L 730 162" class="arrow-return"/>

  <!-- ===== Bottom emphasis: safety boundary ===== -->
  <rect x="30" y="360" width="920" height="78" fill="#fff5f5" stroke="#9b1c1c" stroke-width="1.6"/>
  <text x="42" y="384" class="label" fill="#9b1c1c">Safety boundary for Round 1</text>
  <text x="42" y="402" class="tiny">Round 1 demonstrates sensing, comfort logic, manual override, and safe fallback on a safe test setup.</text>
  <text x="42" y="418" class="tiny">Powered fan operation, if any, is confined to a controlled test setup with an independently reviewed safety plan.</text>
  <text x="42" y="432" class="tiny">Documentation does not authorize fabrication, energization, powered rotor testing, overspeed testing, installation use, or certification.</text>

  <!-- ===== Legend ===== -->
  <rect x="30" y="460" width="920" height="120" fill="#ffffff" stroke="#999" stroke-width="1"/>
  <text x="42" y="482" class="label">Legend</text>

  <rect x="42" y="496" width="40" height="22" class="box-existing"/>
  <text x="90"  y="511" class="legend">Existing / demonstrated in Round 1</text>

  <rect x="290" y="496" width="40" height="22" class="box-proposed"/>
  <text x="338" y="511" class="legend">Proposed for Round 1 prototype</text>

  <rect x="548" y="496" width="40" height="22" class="box-proposed" style="stroke-dasharray:7 4"/>
  <text x="596" y="511" class="legend">Future engineering stage (not Round 1)</text>

  <text x="42" y="535" class="legend">Flow:</text>
  <text x="90"  y="535" class="legend">temperature/humidity sensors → local controller → comfort &amp; automation logic → fan-drive interface and/or smart-home output → feedback/status.</text>

  <text x="42" y="558" class="legend">Note:</text>
  <text x="90"  y="558" class="legend">This diagram shows the proposed architecture. It does not depict a completed product or a real prototype photograph.</text>

</svg>
